<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="solutions-mountain-svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradiente dos relevos e facetas da montanha -->
    <linearGradient id="mnt-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E7BFA" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#A6B5FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="mnt-grad-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D44B8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#3E7BFA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0E1013" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="mnt-grad-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E7BFA" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#3E7BFA" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="arrow-stroke-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D44B8" />
      <stop offset="40%" stop-color="#3E7BFA" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Filtro de brilho sutil para a seta de crescimento -->
    <filter id="glow-arrow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Marcador de ponta de seta técnica -->
    <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3E7BFA" />
    </marker>
  </defs>
  <g class="mountain-body-layer">
    <!-- Silhueta Global Suave -->
    <path class="mnt-poly" d="M 440,700 L 490,620 L 530,640 L 590,540 L 640,560 L 710,410 L 750,440 L 810,260 L 840,290 L 885,85 L 930,220 L 965,340 L 985,510 L 1000,700 Z" fill="url(#mnt-grad-light)" />
    <!-- Faceta de cúpula e arestas principais (Lado sombreado técnico) -->
    <polygon class="mnt-facet" points="885,85 930,220 890,260 850,220" fill="url(#mnt-grad-shade)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.3" />
    <polygon class="mnt-facet" points="885,85 850,220 810,260 835,170" fill="url(#mnt-grad-light)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.35" />
    <polygon class="mnt-facet" points="810,260 840,290 800,360 760,330" fill="url(#mnt-grad-shade)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.25" />
    <polygon class="mnt-facet" points="810,260 760,330 710,410 750,370" fill="url(#mnt-grad-light)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.3" />
    <polygon class="mnt-facet" points="710,410 750,440 700,510 660,480" fill="url(#mnt-grad-shade)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.25" />
    <polygon class="mnt-facet" points="710,410 660,480 590,540 640,490" fill="url(#mnt-grad-light)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.25" />
    <polygon class="mnt-facet" points="590,540 640,560 580,630 530,600" fill="url(#mnt-grad-shade)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.2" />
    <polygon class="mnt-facet" points="590,540 530,600 490,620 520,570" fill="url(#mnt-grad-light)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.2" />
    <polygon class="mnt-facet" points="930,220 965,340 920,380 890,260" fill="url(#mnt-grad-shade)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.25" />
    <polygon class="mnt-facet" points="965,340 985,510 940,540 920,380" fill="url(#mnt-grad-shade)" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.2" />
    <!-- Linhas de Nível Topográficas Técnicas (Hairlines) -->
    <path class="mnt-contour" d="M 470,680 Q 520,640 570,660 T 670,630 T 780,640 T 900,620 T 1000,650" fill="none" stroke="#3E7BFA" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3" />
    <path class="mnt-contour" d="M 500,610 Q 560,570 610,590 T 720,560 T 820,570 T 920,540 T 1000,570" fill="none" stroke="#3E7BFA" stroke-width="1" stroke-opacity="0.28" />
    <path class="mnt-contour" d="M 550,530 Q 610,490 660,510 T 760,480 T 850,490 T 940,460 T 995,490" fill="none" stroke="#3E7BFA" stroke-width="1" stroke-opacity="0.32" stroke-dasharray="6 3" />
    <path class="mnt-contour" d="M 620,440 Q 680,400 730,420 T 820,390 T 890,400 T 965,380" fill="none" stroke="#3E7BFA" stroke-width="1" stroke-opacity="0.35" />
    <path class="mnt-contour" d="M 680,350 Q 740,310 790,330 T 860,300 T 935,310 T 980,330" fill="none" stroke="#3E7BFA" stroke-width="1" stroke-opacity="0.38" stroke-dasharray="4 2" />
    <path class="mnt-contour" d="M 750,250 Q 800,210 840,230 T 910,210 T 950,250" fill="none" stroke="#3E7BFA" stroke-width="1.2" stroke-opacity="0.45" />
    <path class="mnt-contour" d="M 820,160 Q 860,120 885,130 T 920,170" fill="none" stroke="#3E7BFA" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="5 2" />
    <!-- Aresta dorsal da montanha em destaque -->
    <path class="mnt-ridge" d="M 490,620 L 590,540 L 710,410 L 810,260 L 885,85" fill="none" stroke="#3E7BFA" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round" />
    <path class="mnt-ridge-sec" d="M 885,85 L 930,220 L 965,340 L 985,510 L 1000,700" fill="none" stroke="#3E7BFA" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round" />
    <!-- Constelação ASCII & Elementos Matriciais do DESIGN.md -->
    <g class="mnt-ascii" font-family="'DM Mono', monospace" font-size="10" fill="#3E7BFA" opacity="0.45" letter-spacing="2">
      <!-- Cluster Cúpula -->
      <text x="830" y="70">.:##:::</text>
      <text x="895" y="65">###:..%</text>
      <text x="860" y="50">0101#</text>
      <text x="910" y="45">.::##</text>
      <text x="880" y="30">##</text>

      <!-- Perto do Cume Secundário -->
      <text x="760" y="190">.:##::</text>
      <text x="780" y="210">%%%###</text>
      <text x="940" y="210">::0101</text>
      <text x="955" y="230">###:.</text>

      <!-- Meia Encosta -->
      <text x="660" y="340">#%##:.</text>
      <text x="680" y="360">0101::</text>
      <text x="720" y="370">::##</text>
      <text x="870" y="350">.::###</text>

      <!-- Base da Crista -->
      <text x="540" y="490">::01::</text>
      <text x="560" y="510">###%..</text>
      <text x="610" y="520">::##</text>
      <text x="470" y="600">0101#</text>
      <text x="500" y="630">.::##</text>
    </g>
    <!-- Marcadores Técnicos & Telemetria de Elevação -->
    <g class="mnt-telemetry" font-family="'DM Mono', monospace" font-size="8.5" fill="#5A6065" opacity="0.7">
      <!-- Cume Principal -->
      <circle cx="885" cy="85" r="2.5" fill="#3E7BFA" />
      <circle cx="885" cy="85" r="6" fill="none" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="898" y="88" fill="#3E7BFA" font-weight="bold">SUMMIT // ALT 4,810M</text>

      <!-- Waypoint 02 -->
      <line x1="705" y1="410" x2="680" y2="410" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="600" y="413" fill="#8C9298">COORD // LAT 02.44</text>

      <!-- Cruz Técnica de Âncora -->
      <path d="M 970,95 L 980,95 M 975,90 L 975,100" stroke="#0E1013" stroke-width="1" stroke-opacity="0.25" />
      <path d="M 450,670 L 460,670 M 455,665 L 455,675" stroke="#0E1013" stroke-width="1" stroke-opacity="0.25" />
    </g>
  </g>
  <g class="mountain-growth-arrow-group">
    <!-- Trilho de fundo pontilhado/sutil para dar contraste à rota -->
    <path class="arrow-track" d="M 480,670 Q 530,620 570,580 T 660,460 T 740,360 T 820,230 T 925,95" fill="none" stroke="#E4E7EC" stroke-width="3" stroke-dasharray="2 4" stroke-opacity="0.8" />

    <!-- Linha Ativa da Seta de Crescimento (animada via stroke-dashoffset) -->
    <path id="growth-arrow-line" class="growth-arrow-line" d="M 480,670 Q 530,620 570,580 T 660,460 T 740,360 T 820,230 T 925,95" fill="none" stroke="url(#arrow-stroke-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-arrow)" />

    <!-- Ponta da Seta no Topo (apontando para cima e direita ↗) -->
    <g id="growth-arrow-head" class="growth-arrow-head" transform="translate(925, 95) rotate(-45)">
      <polygon points="0,-12 12,8 0,3 -12,8" fill="#3E7BFA" filter="url(#glow-arrow)" />
      <polygon points="0,-10 9,6 0,2 -9,6" fill="#00D2FF" />
    </g>

    <!-- Marcadores de Estágios de Escala da Empresa ao Longo da Subida -->
    <g class="arrow-milestones" font-family="'DM Mono', monospace" font-size="8" fill="#0E1013" font-weight="500">
      <!-- Ponto 1: Automação Base -->
      <circle cx="570" cy="580" r="3.5" fill="#3E7BFA" />
      <circle cx="570" cy="580" r="7" fill="none" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.5" />
      <rect x="582" y="572" width="76" height="15" fill="#FFFFFF" stroke="#3E7BFA" stroke-width="0.8" rx="2" />
      <text x="586" y="583" fill="#3E7BFA" font-size="7.5" font-weight="bold">STG 01 · RPA</text>

      <!-- Ponto 2: Integração e Fluxos -->
      <circle cx="740" cy="360" r="3.5" fill="#3E7BFA" />
      <circle cx="740" cy="360" r="7" fill="none" stroke="#3E7BFA" stroke-width="0.8" stroke-opacity="0.5" />
      <rect x="752" y="352" width="84" height="15" fill="#FFFFFF" stroke="#3E7BFA" stroke-width="0.8" rx="2" />
      <text x="756" y="363" fill="#3E7BFA" font-size="7.5" font-weight="bold">STG 02 · INTEGR</text>

      <!-- Ponto 3: IA e Escala Máxima -->
      <circle cx="820" cy="230" r="4" fill="#00D2FF" />
      <circle cx="820" cy="230" r="8" fill="none" stroke="#00D2FF" stroke-width="0.8" stroke-opacity="0.6" />
      <rect x="832" y="222" width="94" height="15" fill="#FFFFFF" stroke="#00D2FF" stroke-width="0.8" rx="2" />
      <text x="836" y="233" fill="#1D44B8" font-size="7.5" font-weight="bold">STG 03 · IA SCALE</text>

      <!-- Badge de Impacto no Topo -->
      <g transform="translate(860, 50)">
        <rect x="0" y="0" width="128" height="20" fill="#0E1013" rx="2" />
        <circle cx="9" cy="10" r="3" fill="#10B981" />
        <text x="17" y="14" fill="#FFFFFF" font-size="8.5" font-weight="bold" letter-spacing="0.5">CRESCIMENTO 10X ↗</text>
      </g>
    </g>
  </g>
</svg>